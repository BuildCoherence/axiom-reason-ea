name: old-client-matrix

# Each released 1.x axm, in a committed Workspace on the template tag its
# `axm init` cloned, runs `axm upgrade` against a preview Version Feed host and
# a candidate release, then must report the candidate version, the target
# template, an unchanged user-added skill and an installed corpus.
on:
  workflow_dispatch:
    inputs:
      release-base-url:
        description: Candidate release base URL, a GCS axm/<ver>/ directory (AXM_RELEASE_BASE_URL)
        required: true
        type: string
      api-url:
        description: Preview Version Feed host (AXIOM_API_URL)
        required: true
        type: string
      want-version:
        description: axm version the upgrade must install
        type: string
        default: "2.0.0"
      want-template:
        description: axiom-client tag every Workspace must reach
        type: string
        default: v2.0.0

permissions:
  contents: read

jobs:
  cell:
    name: axm ${{ matrix.cli }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        cli:
          - 1.0.0-beta
          - 1.0.1-beta
          - 1.1.0-beta
          - 1.1.1-beta
          - 1.1.2-beta
          - 1.1.3-beta
          - 1.1.4-beta
          - 1.1.5-beta
        include:
          - { os: windows-latest, cli: 1.1.5-beta }
          - { os: macos-latest, cli: 1.1.5-beta }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Upgrade the old client and check the result
        shell: bash
        env:
          AXIOM_API_URL: ${{ inputs.api-url }}
          AXM_RELEASE_BASE_URL: ${{ inputs.release-base-url }}
          WANT_VERSION: ${{ inputs.want-version }}
          WANT_TEMPLATE: ${{ inputs.want-template }}
          CLI: ${{ matrix.cli }}
        run: |
          go run ./scripts/old-client-matrix -cli "$CLI" \
            -want-version "$WANT_VERSION" -want-template "$WANT_TEMPLATE" -work "$RUNNER_TEMP/cell"
